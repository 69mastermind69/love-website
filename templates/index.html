<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>For You 💗</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at top left,
                    #ffd6e7,
                    transparent 40%
                ),
                radial-gradient(
                    circle at bottom right,
                    #d9c7ff,
                    transparent 40%
                ),
                #fff0f6;
        }


        /* Floating hearts */

        .heart {
            position: fixed;
            bottom: -50px;

            font-size: 25px;

            animation:
                floatUp 6s linear infinite;

            opacity: 0.7;

            pointer-events: none;
        }


        @keyframes floatUp {

            0% {
                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 0;
            }

            20% {
                opacity: 0.8;
            }

            100% {
                transform:
                    translateY(-110vh)
                    rotate(360deg);

                opacity: 0;
            }
        }


        /* Main card */

        .card {

            width: 420px;

            max-width: 90%;

            min-height: 430px;

            background:
                rgba(255,255,255,0.94);

            border-radius: 30px;

            padding: 40px 30px;

            text-align: center;

            box-shadow:
                0 20px 50px
                rgba(0,0,0,0.15);

            position: relative;

            z-index: 10;

            display: flex;

            flex-direction: column;

            justify-content: center;

            animation: appear 0.6s ease;
        }


        @keyframes appear {

            from {
                opacity: 0;

                transform:
                    translateY(20px)
                    scale(0.95);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        .emoji {
            font-size: 55px;
            margin-bottom: 10px;
        }


        h1 {
            margin: 10px 0;

            color: #ff4f87;

            font-size: 30px;
        }


        p {
            color: #666;

            font-size: 18px;

            line-height: 1.5;
        }


        input {

            width: 90%;

            padding: 14px;

            margin-top: 15px;

            border-radius: 15px;

            border: 2px solid #ffd0df;

            outline: none;

            font-size: 16px;

            text-align: center;
        }


        input:focus {
            border-color: #ff4f87;
        }


        button {

            border: none;

            padding: 14px 25px;

            margin: 10px 5px;

            border-radius: 30px;

            background: #ff4f87;

            color: white;

            font-size: 17px;

            cursor: pointer;

            transition: 0.2s;
        }


        button:hover {
            transform: scale(1.07);
        }


        /* Progress bar */

        .progress {

            position: absolute;

            top: 20px;

            left: 25px;

            right: 25px;

            height: 6px;

            background: #eee;

            border-radius: 10px;

            overflow: hidden;
        }


        .progress-bar {

            height: 100%;

            background: #ff4f87;

            transition: 0.5s;
        }


        /* Love buttons */

        .love-buttons {

            position: relative;

            min-height: 130px;

            margin-top: 15px;
        }


        #noButton {

            background: #ddd;

            color: #555;

            position: relative;

            transition:
                left 0.15s,
                top 0.15s;
        }


        /* Final heart */

        .big-heart {

            font-size: 90px;

            animation:
                heartbeat 1s infinite;
        }


        @keyframes heartbeat {

            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }
        }


        /* Powered by */

        .powered-by {

            position: fixed;

            bottom: 10px;

            left: 0;

            width: 100%;

            text-align: center;

            font-size: 13px;

            color: #888;

            z-index: 20;

            pointer-events: none;
        }


        /* Mobile */

        @media (max-width: 500px) {

            .card {

                min-height: 400px;

                padding: 35px 20px;
            }

            h1 {
                font-size: 26px;
            }

            p {
                font-size: 16px;
            }

            button {

                font-size: 16px;

                padding:
                    12px 20px;
            }

            .powered-by {

                font-size: 12px;

                bottom: 7px;
            }
        }

    </style>

</head>


<body>


    <!-- Floating hearts -->

    <div class="heart"
         style="left:10%; animation-delay:0s;">
        💗
    </div>

    <div class="heart"
         style="left:30%; animation-delay:2s;">
        💕
    </div>

    <div class="heart"
         style="left:50%; animation-delay:1s;">
        ❤️
    </div>

    <div class="heart"
         style="left:70%; animation-delay:3s;">
        💖
    </div>

    <div class="heart"
         style="left:90%; animation-delay:1.5s;">
        💗
    </div>


    <!-- Main website -->

    <div class="card" id="app">

        <div class="progress">

            <div
                class="progress-bar"
                style="width:0%">
            </div>

        </div>


        <div class="emoji">
            💌
        </div>


        <h1>
            Hey You! 💕
        </h1>


        <p>
            I made a little something special
            just for you...
        </p>


        <button onclick="start()">

            Let's Start ❤️

        </button>

    </div>


    <!-- Powered by -->

    <div class="powered-by">
        Powered by Do_x_Die
    </div>



<script>


    let userName = "";

    let birthday = "";

    let favouriteColor = "";

    let loveAnswer = "";



    /* =========================
       START
    ========================= */

    function start() {

        showNameQuestion();

    }



    /* =========================
       NAME QUESTION
    ========================= */

    function showNameQuestion() {

        document.getElementById("app").innerHTML = `

            <div class="progress">

                <div
                    class="progress-bar"
                    style="width:20%">
                </div>

            </div>


            <div class="emoji">
                👤
            </div>


            <h1>
                First Question 💗
            </h1>


            <p>
                What is your name?
            </p>


            <input
                id="name"
                type="text"
                placeholder="Type your name..."
                maxlength="100"
            >


            <br>


            <button onclick="saveName()">

                Continue 💕

            </button>

        `;
    }



    function saveName() {

        let value =
            document
                .getElementById("name")
                .value
                .trim();


        if (value === "") {

            alert(
                "Please enter your name 😊"
            );

            return;
        }


        userName = value;

        showBirthdayQuestion();

    }



    /* =========================
       BIRTHDAY
    ========================= */

    function showBirthdayQuestion() {

        document.getElementById("app").innerHTML = `

            <div class="progress">

                <div
                    class="progress-bar"
                    style="width:40%">
                </div>

            </div>


            <div class="emoji">
                🎂
            </div>


            <h1>
                Nice to meet you,
                ${escapeHtml(userName)}! 💕
            </h1>


            <p>
                When is your birthday?
            </p>


            <input
                id="birthday"
                type="date"
            >


            <br>


            <button onclick="saveBirthday()">

                Continue 🎂

            </button>

        `;
    }



    function saveBirthday() {

        let value =
            document
                .getElementById("birthday")
                .value;


        if (value === "") {

            alert(
                "Please select your birthday 😊"
            );

            return;
        }


        birthday = value;

        showColorQuestion();

    }



    /* =========================
       FAVOURITE COLOR
    ========================= */

    function showColorQuestion() {

        document.getElementById("app").innerHTML = `

            <div class="progress">

                <div
                    class="progress-bar"
                    style="width:60%">
                </div>

            </div>


            <div class="emoji">
                🎨
            </div>


            <h1>
                One More Thing...
            </h1>


            <p>
                What's your favourite color?
            </p>


            <input
                id="color"
                type="text"
                placeholder="Your favourite color..."
                maxlength="100"
            >


            <br>


            <button onclick="saveColor()">

                Continue 💗

            </button>

        `;
    }



    function saveColor() {

        let value =
            document
                .getElementById("color")
                .value
                .trim();


        if (value === "") {

            alert(
                "Tell me your favourite color 😊"
            );

            return;
        }


        favouriteColor = value;

        showLoveQuestion();

    }



    /* =========================
       DO YOU LOVE ME?
    ========================= */

    function showLoveQuestion() {

        document.getElementById("app").innerHTML = `

            <div class="progress">

                <div
                    class="progress-bar"
                    style="width:80%">
                </div>

            </div>


            <div class="emoji">
                🥺
            </div>


            <h1>
                ${escapeHtml(userName)}...
            </h1>


            <p>
                Do you love me? ❤️
            </p>


            <div class="love-buttons">

                <button onclick="yesAnswer()">

                    YES ❤️

                </button>


                <button
                    id="noButton"
                    type="button"
                >

                    NO 😏

                </button>

            </div>

        `;


        setupNoButton();

    }



    /* =========================
       NO BUTTON RUNS AWAY
    ========================= */

    function setupNoButton() {

        const noButton =
            document.getElementById("noButton");


        noButton.addEventListener(
            "mouseenter",
            moveNoButton
        );


        noButton.addEventListener(
            "touchstart",
            moveNoButton,
            {
                passive: false
            }
        );

    }



    function moveNoButton(event) {

        if (event) {

            event.preventDefault();

        }


        const noButton =
            document.getElementById("noButton");


        if (!noButton) {

            return;

        }


        const x =
            Math.random() * 220 - 110;


        const y =
            Math.random() * 100 - 50;


        noButton.style.position =
            "relative";


        noButton.style.left =
            x + "px";


        noButton.style.top =
            y + "px";

    }



    /* =========================
       YES ANSWER
    ========================= */

    function yesAnswer() {

        loveAnswer = "YES";


        document.getElementById("app").innerHTML = `

            <div class="big-heart">
                ❤️
            </div>


            <h1>
                YAYYYY! 🎉
            </h1>


            <p>
                I knew you would say YES! 🥺💕
            </p>


            <p>
                ${escapeHtml(userName)},
                you are really special. 🥰
            </p>


            <button onclick="showMessageQuestion()">

                One More Thing... 👀

            </button>

        `;

    }



    /* =========================
       MESSAGE
    ========================= */

    function showMessageQuestion() {

        document.getElementById("app").innerHTML = `

            <div class="progress">

                <div
                    class="progress-bar"
                    style="width:100%">
                </div>

            </div>


            <div class="emoji">
                💌
            </div>


            <h1>
                One Last Thing...
            </h1>


            <p>
                Say something nice to me 🥺
            </p>


            <form
                action="/submit"
                method="POST"
            >


                <input
                    type="hidden"
                    name="name"
                    value="${escapeHtml(userName)}"
                >


                <input
                    type="hidden"
                    name="birthday"
                    value="${escapeHtml(birthday)}"
                >


                <input
                    type="hidden"
                    name="favorite_color"
                    value="${escapeHtml(favouriteColor)}"
                >


                <input
                    type="hidden"
                    name="love_answer"
                    value="${escapeHtml(loveAnswer)}"
                >


                <input
                    name="message"
                    type="text"
                    placeholder="Write something..."
                    maxlength="1000"
                    required
                >


                <br>


                <button type="submit">

                    Submit ❤️

                </button>


            </form>

        `;

    }



    /* =========================
       ESCAPE HTML
    ========================= */

    function escapeHtml(text) {

        const div =
            document.createElement("div");


        div.textContent = text;


        return div.innerHTML;

    }


</script>


</body>

</html>
